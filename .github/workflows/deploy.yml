name: Deploy to production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

# Never run two app replacements on the same VM at once. A newer
# deployment waits for an approved/running deployment instead of interrupting it.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved main build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud through OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy the approved image to the VM
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_INSTANCE_NAME: ${{ vars.GCP_INSTANCE_NAME }}
          GCP_APP_USER: ${{ vars.GCP_APP_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          : "${GCP_PROJECT_ID:?Set the production GCP_PROJECT_ID environment variable.}"
          : "${GCP_INSTANCE_NAME:?Set the production GCP_INSTANCE_NAME environment variable.}"
          : "${GCP_APP_USER:?Set the production GCP_APP_USER environment variable.}"
          : "${IMAGE_TAG:?Missing image tag.}"

          if [[ ! "$GCP_APP_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "GCP_APP_USER contains unsupported characters." >&2
            exit 1
          fi

          zone="$(gcloud compute instances list \
            --project "$GCP_PROJECT_ID" \
            --filter="name=$GCP_INSTANCE_NAME" \
            --format='value(zone)' | sed -n '1{s#.*/##;p;}')"
          if [[ -z "$zone" ]]; then
            echo "Could not find VM: $GCP_INSTANCE_NAME" >&2
            exit 1
          fi

          project_dir="/home/$GCP_APP_USER/car_rental"
          remote_command="sudo -u $GCP_APP_USER -H env PROJECT_DIR=$project_dir $project_dir/deploy/deploy-app.sh $IMAGE_TAG"
          gcloud compute ssh "$GCP_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$zone" \
            --command "$remote_command" \
            --quiet

      - name: Verify the public health endpoint
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: ./deploy/smoke-test.sh
