name: Deploy to production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

# Never run two app replacements on the same EC2 instance at once. A newer
# deployment waits for an approved/running deployment instead of interrupting it.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved main build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Temporary: shows only non-secret OIDC claims so the IAM trust condition
      # can be compared with the subject GitHub actually sends to AWS.
      - name: Diagnose OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            core.info(JSON.stringify({
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              ref: claims.ref,
              environment: claims.environment
            }));

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send app deployment command through SSM
        id: ssm
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          : "${EC2_INSTANCE_ID:?Set the production EC2_INSTANCE_ID environment variable.}"
          : "${IMAGE_TAG:?Missing image tag.}"

          remote_command="sudo -u ubuntu -H /home/ubuntu/car_rental/deploy/deploy-app.sh $IMAGE_TAG"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "commands=$remote_command" \
            --comment "car-rental deployment $IMAGE_TAG" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id"

          for attempt in {1..90}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success)
                echo "Remote deployment succeeded."
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json || true
                echo "Remote deployment ended with: $status" >&2
                exit 1
                ;;
              *)
                echo "Waiting for SSM command ($attempt/90): ${status:-not-visible-yet}"
                sleep 4
                ;;
            esac
          done

          if [[ "${status:-}" != "Success" ]]; then
            echo "Timed out waiting for the SSM command." >&2
            exit 1
          fi

      - name: Show remote deployment output when a failure occurs
        if: failure() && steps.ssm.outputs.command_id != ''
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json || true

      - name: Verify the public health endpoint
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: ./deploy/smoke-test.sh
