name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      app_base_url:
        description: Public URL to check, such as https://example.com
        required: true
        type: string

permissions:
  contents: read

jobs:
  health:
    name: Check deployed health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check /health through the public URL
        env:
          APP_BASE_URL: ${{ inputs.app_base_url }}
          SMOKE_MAX_ATTEMPTS: "12"
          SMOKE_RETRY_DELAY_SECONDS: "5"
        run: bash deploy/smoke-test.sh
